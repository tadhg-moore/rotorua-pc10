name: Render and Publish Quarto Website

on:
  push:
    branches: [main]     # or 'master'
  pull_request:
  workflow_dispatch:      # allow manual trigger

permissions:
  contents: write         # needed to publish to GitHub Pages

jobs:
  build-deploy:
    runs-on: windows-latest
    env:
      R_KEYRING_BACKEND: basic
      ONEDRIVE_TOKEN_ENCRYPTED: ${{ secrets.ONEDRIVE_TOKEN_ENCRYPTED }}
      ONEDRIVE_TOKEN_PASSWORD: ${{ secrets.ONEDRIVE_TOKEN_PASSWORD }}
      ONEDRIVE_TOKEN_HASH: ${{ secrets.ONEDRIVE_TOKEN_HASH }}
      LERNZMP_KEY: ${{ secrets.LERNZMP_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Setup R
        uses: r-lib/actions/setup-r@v2

      - name: Check disk space before renv restore
        run: Get-PSDrive -PSProvider FileSystem

      - name: Setup renv
        uses: r-lib/actions/setup-renv@v2
        with:
          cache-version: 1

      - name: Check disk space after renv restore
        if: always()
        run: Get-PSDrive -PSProvider FileSystem

      - name: Cache targets store
        uses: actions/cache@v4
        with:
          path: _targets
          key: ${{ runner.os }}-targets-${{ hashFiles('_targets.R', 'R/**') }}
          restore-keys: |
            ${{ runner.os }}-targets-

      - name: Render site
        run: quarto render website   # use 'website' dir

      - name: Publish to GitHub Pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          path: website
          render: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
