name: Render and Publish Quarto Website

on:
  push:
    branches: [main]     # or 'master'
  pull_request:
  workflow_dispatch:      # allow manual trigger

permissions:
  contents: write         # needed to publish to GitHub Pages

jobs:
  build-deploy:
    runs-on: windows-latest
    env:
      R_KEYRING_BACKEND: basic
      ONEDRIVE_TOKEN_ENCRYPTED: ${{ secrets.ONEDRIVE_TOKEN_ENCRYPTED }}
      ONEDRIVE_TOKEN_PASSWORD: ${{ secrets.ONEDRIVE_TOKEN_PASSWORD }}
      ONEDRIVE_TOKEN_HASH: ${{ secrets.ONEDRIVE_TOKEN_HASH }}
      LERNZMP_KEY: ${{ secrets.LERNZMP_KEY }}
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Setup R
        uses: r-lib/actions/setup-r@v2

      - name: Setup renv
        id: setup_renv
        continue-on-error: true
        uses: r-lib/actions/setup-renv@v2
        with:
          cache-version: 1

      - name: Restore stuck package cluster individually, then retry full restore
        if: steps.setup_renv.outcome == 'failure'
        run: |
          Rscript -e '
          cluster <- c("secretbase", "targets", "tarchetypes", "nanonext", "mirai", "crew",
                       "curl", "httr", "httr2", "AzureAuth", "AzureGraph", "rstudioapi",
                       "getPass", "kableExtra", "XML", "tmaptools", "maptiles", "gh",
                       "ecmwfr", "plotly", "tmap", "Microsoft365R", "bathytools", "AEME",
                       "aemetools", "ltapi")
          renv::restore(packages = cluster)
          renv::restore()
          '

      - name: Cache targets store
        uses: actions/cache@v4
        with:
          path: _targets
          key: ${{ runner.os }}-targets-${{ hashFiles('_targets.R', 'R/**') }}
          restore-keys: |
            ${{ runner.os }}-targets-

      - name: Render site
        run: quarto render website   # use 'website' dir

      - name: Publish to GitHub Pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          path: website
          render: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
