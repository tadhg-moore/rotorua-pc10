name: Render and Publish Quarto Website

on:
  push:
    branches: [main]     # or 'master'
  pull_request:
  workflow_dispatch:      # allow manual trigger

permissions:
  contents: write         # needed to publish to GitHub Pages

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      R_KEYRING_BACKEND: basic
      ONEDRIVE_TOKEN_ENCRYPTED: ${{ secrets.ONEDRIVE_TOKEN_ENCRYPTED }}
      ONEDRIVE_TOKEN_PASSWORD: ${{ secrets.ONEDRIVE_TOKEN_PASSWORD }}
      ONEDRIVE_TOKEN_HASH: ${{ secrets.ONEDRIVE_TOKEN_HASH }}
      LERNZMP_KEY: ${{ secrets.LERNZMP_KEY }}
      GITHUB_PAT: ${{ secrets.GH_PAT }}
      GH_PAT: ${{ secrets.GH_PAT }}
      # Pinned GLM build: "latest" re-resolves on every run, so a new GLM release can change
      # (or break) results without any commit. Bump this deliberately.
      GLM_VERSION: "4.0.0+"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            gdal-bin \
            libabsl-dev \
            libcurl4-openssl-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libgdal-dev \
            libgeos-dev \
            libglpk-dev \
            libnetcdf-dev \
            libpng-dev \
            libsecret-1-dev \
            libudunits2-dev \
            libx11-dev \
            pandoc

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Setup R
        uses: r-lib/actions/setup-r@v2

      - name: Setup renv
        id: setup_renv
        continue-on-error: true
        uses: r-lib/actions/setup-renv@v2
        with:
          cache-version: 1

      # GLM binary (AEME::install_glm_aed): cached by version so it is not downloaded every run.
      # tools::R_user_dir("AEME", "data") is ~/.local/share/R/AEME on Linux.
      - name: Cache GLM binary
        uses: actions/cache@v4
        with:
          path: ~/.local/share/R/AEME
          key: glm-${{ runner.os }}-${{ env.GLM_VERSION }}

      # Targets store: always restore the newest one (the key never matches exactly, so the
      # restore-keys prefix picks the latest), and save a new copy only when the pipeline
      # produced new data (see the `changed` output of the next step). The store is ~1.2 GB,
      # so saving on every run would evict the other caches from the 10 GB limit.
      - name: Restore targets store
        uses: actions/cache/restore@v4
        with:
          path: _targets
          key: ${{ runner.os }}-targets-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-targets-

      - name: Run targets pipeline
        id: targets
        working-directory: website
        run: Rscript scripts/build_data.R

      - name: Save targets store
        if: ${{ !cancelled() && steps.targets.outputs.changed == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: _targets
          key: ${{ runner.os }}-targets-${{ github.run_id }}

      # Quarto freeze (rendered output of unchanged pages). Small, so saved every run; the
      # newest copy is restored and quarto's `freeze: auto` re-renders only pages whose
      # source changed.
      - name: Restore Quarto freeze
        uses: actions/cache/restore@v4
        with:
          path: website/_freeze
          key: ${{ runner.os }}-freeze-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-freeze-

      - name: Render site
        run: quarto render website   # use 'website' dir

      - name: Save Quarto freeze
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v4
        with:
          path: website/_freeze
          key: ${{ runner.os }}-freeze-${{ github.run_id }}

      - name: Publish to GitHub Pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          path: website
          render: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
